name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / FuseAPI ${{ matrix.fuseapi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        fuseapi: ["2.0.0", "2.1.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install exact conformance dependencies
        run: |
          python -m pip install --require-hashes -r requirements-conformance.txt
          python -m pip install --no-deps -e .
          if [ '${{ matrix.fuseapi }}' = '2.0.0' ]; then
            python -m pip install 'juntai-fuse-api==2.0.0'
          fi
      - name: Verify exact dependency releases
        run: |
          python -c 'import importlib.metadata as m; assert m.version("juntai-fuse-api") == "${{ matrix.fuseapi }}"; assert m.version("juntai-artifact-client") == "1.0.2"'
          python -m pip check
      - run: pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - name: Build distributions
        if: matrix.python == '3.13' && matrix.fuseapi == '2.1.0'
        run: python -m build
      - name: Verify clean wheel install
        if: matrix.python == '3.13' && matrix.fuseapi == '2.1.0'
        run: |
          python -m venv /tmp/juntai-documentation-clean
          /tmp/juntai-documentation-clean/bin/python -m pip install dist/*.whl
          /tmp/juntai-documentation-clean/bin/juntai-capability --help
          /tmp/juntai-documentation-clean/bin/python -c 'from juntai.documentation import build_bundle; print(build_bundle.__module__)'
          /tmp/juntai-documentation-clean/bin/python -m pip install --require-hashes -r requirements-conformance.txt
          /tmp/juntai-documentation-clean/bin/python scripts/verify_fuseapi_consumer.py --out consumer-evidence
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13' && matrix.fuseapi == '2.1.0'
        with:
          name: juntai-documentation-capability-${{ github.sha }}
          path: |
            dist/*
            consumer-evidence/**
            requirements-conformance.txt
          if-no-files-found: error

  console-viewer:
    name: Console viewer
    strategy:
      fail-fast: false
      matrix:
        console-sdk: ["2.1.0", "2.2.0"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/console-viewer/package-lock.json
      - run: npm ci --prefix packages/console-viewer --ignore-scripts
      - name: Install compatibility endpoint
        if: matrix.console-sdk != '2.2.0'
        run: npm install --prefix packages/console-viewer --ignore-scripts --no-save --package-lock=false @zephytiju/console-sdk@${{ matrix.console-sdk }}
      - run: npm run verify --prefix packages/console-viewer

  boundary:
    name: Service-free boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject deployable or domain-owned content
        run: |
          test ! -f Dockerfile
          test ! -f docker-compose.yml
          ! find . -path './.git' -prune -o \( -iname '*deployment*.yaml' -o -iname '*deployment*.yml' \) -print | grep .
          ! grep -R -E 'FastAPI\(|uvicorn\.run|private_database|runtime tool registry' src packages

  required:
    name: Required CI
    if: always()
    needs: [python, console-viewer, boundary]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs
        run: |
          test '${{ needs.python.result }}' = success
          test '${{ needs.console-viewer.result }}' = success
          test '${{ needs.boundary.result }}' = success
