name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact release version
        run: |
          test "$GITHUB_REF_NAME" = v2.2.0
          python -c 'import tomllib; assert tomllib.load(open("pyproject.toml", "rb"))["project"]["version"] == "2.2.0"'
          node -e 'const value=require("./packages/console-viewer/package.json"); if(value.version!=="2.2.0") process.exit(1)'
      - name: Test and build
        run: |
          npm ci --prefix packages/console-viewer --ignore-scripts
          npm run verify --prefix packages/console-viewer
          python -m pip install --require-hashes -r requirements-conformance.txt
          python -m pip install --require-hashes --no-deps -r requirements-meridian.txt
          python -m pip install --no-deps -e .
          python -m pip check
          pytest -q
          ruff check .
          ruff format --check .
          python -m build
          npm pack ./packages/console-viewer --pack-destination dist
      - name: Verify released wheel with genuine FuseAPI exporters
        run: |
          python -m venv /tmp/capability-consumer
          /tmp/capability-consumer/bin/python -m pip install --require-hashes -r requirements-conformance.txt
          /tmp/capability-consumer/bin/python -m pip install --no-deps dist/*.whl
          /tmp/capability-consumer/bin/python -m pip check
          /tmp/capability-consumer/bin/python scripts/verify_fuseapi_consumer.py --out consumer-evidence
          tar -czf dist/fuseapi-2.1.0-consumer-evidence.tar.gz -C consumer-evidence .
          cp requirements-conformance.txt dist/
          cp requirements-meridian.txt dist/
      - name: Generate checksums, SBOM and provenance
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          python scripts/generate_release_evidence.py \
            --dist dist \
            --out release-evidence \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*
            release-evidence/*
      - name: Stage immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/* release-evidence/*
          --draft
          --verify-tag
          --title "Juntai Documentation Capability Bundle 2.2.0"
          --generate-notes
      - name: Publish and lock immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
